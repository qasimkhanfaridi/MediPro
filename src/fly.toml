# Fly.io — client UAT. Create app first: fly apps create <name> --org personal
# Then: fly volumes create medipro_data --region sin --size 1
# See docs/DEPLOY-CLIENT-TESTING.md

app = 'medipro-uat'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  ASPNETCORE_ENVIRONMENT = 'Production'
  ASPNETCORE_URLS = 'http://0.0.0.0:8080'
  ConnectionStrings__DefaultConnection = 'Data Source=/data/MediPro.db'
  DevSeed__Enabled = 'true'
  DevSeed__AdminEmail = 'admin@medipro.local'
  DevSeed__SeedDemoCatalog = 'true'
  DevSeed__SeedDemoStores = 'true'
  DevSeed__SeedDemoOrders = 'true'
  DevSeed__AllowDemoCatalogEndpoint = 'true'
  Inventory__HideStoreStockQuantity = 'true'
  Inventory__AutoDecrementOnOrder = 'false'
  Inventory__EnforceStockQuantityCap = 'false'
  Notifications__AppBaseUrl = 'https://medipro-uat.fly.dev'
  Notifications__EmailEnabled = 'false'
  Notifications__PendingStoreReminderEnabled = 'true'
  Notifications__PendingStoreReminderHours = '24'
  Notifications__ReminderCheckIntervalMinutes = '15'
  Notifications__WhatsAppEnabled = 'false'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = '45s'
    interval = '30s'
    method = 'GET'
    path = '/api/health'
    timeout = '5s'

[[mounts]]
  source = 'medipro_data'
  destination = '/data'
  initial_size = '1gb'
